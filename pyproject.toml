[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arewethesame"
version = "0.3.0"
description = "Causal matched-control rendering and validation experiments for autobiographical self-conditioning in language models"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Khagendra01"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
arewethesame = "arewethesame.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
