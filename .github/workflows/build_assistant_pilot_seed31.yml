name: build-assistant-pilot-seed31

on:
  push:
    branches:
      - pilot-seed31-1000
    paths:
      - scripts/build_assistant_pilot_seed31.py
      - .github/workflows/build_assistant_pilot_seed31.yml

permissions:
  contents: write

jobs:
  build-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e '.[dev]'

      - name: Build frozen 1k assistant pilot
        run: python scripts/build_assistant_pilot_seed31.py

      - name: Verify pilot report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('experiments/assistant_v03_pilot_seed31/report.json').read_text())
          assert report['pairs'] == 1000, report
          assert report['rows'] == 5000, report
          assert report['accepted_pairs'] == 1000, report
          assert report['accepted_rows'] == 5000, report
          assert report['external_provider_used'] is False, report
          assert report['pair_splits'] == {'test': 100, 'train': 850, 'validation': 50}, report['pair_splits']
          assert report['conditions'] == {
              'neutral': 1000,
              'self': 1000,
              'other': 1000,
              'shuffled_self': 1000,
              'spp': 1000,
          }, report['conditions']
          print(json.dumps(report, indent=2))
          PY

      - name: Run repository tests
        run: pytest -q

      - name: Commit frozen pilot artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/assistant_v03_pilot_seed31
          if git diff --cached --quiet; then
            echo "Pilot artifacts already match the frozen build."
          else
            git commit -m "Generate frozen assistant v0.3 1k pilot [skip ci]"
            git push origin HEAD:pilot-seed31-1000
          fi
