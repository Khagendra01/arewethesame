name: ICLR submission revision package

on:
  push:
    branches:
      - paper/iclr2027-draft
    paths:
      - '.github/workflows/iclr_submission_revision.yml'
      - 'paper/**'
      - 'scripts/apply_iclr2027_revision.py'
      - 'scripts/analyze_v07_submission_diagnostics.py'
      - 'scripts/build_iclr2027_revision_release.py'
      - 'scripts/build_v04_corpus.py'
      - 'scripts/build_v05_corpus.py'
      - 'scripts/build_locked_v07_reviewer_controls.py'
      - 'scripts/v07_contrasts.py'
      - 'scripts/train_condition_lora.py'
      - 'scripts/eval_v07_reviewer_controls.py'
      - 'eval/locked_v07_reviewer_controls/**'
      - 'experiments/assistant_v05_seed202/report.json'
      - 'experiments/assistant_v05_seed202/sha256.json'
      - 'docs/PREREGISTRATION_*.md'
      - 'docs/FINAL_STATISTICAL_AUDIT_V07.md'
      - 'modal_train_v05.py'
      - 'modal_replicate_seeds.py'
      - 'modal_train_mistral.py'
      - 'modal_eval_v07.py'
      - 'src/**'
      - 'pyproject.toml'
      - 'requirements-train.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revised-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assert scoped revision is fully materialized
        run: |
          python3 scripts/apply_iclr2027_revision.py
          if ! git diff --quiet; then
            echo 'Revision applicator changed tracked source; final commit is incomplete.' >&2
            git diff --stat >&2
            exit 1
          fi

      - name: Install CPU build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended \
            texlive-bibtex-extra poppler-utils mupdf-tools binutils zip unzip
          python3 -m pip install --quiet 'numpy==2.3.5'
          python3 - <<'PY'
          import sys, numpy
          print('python', sys.version)
          print('numpy', numpy.__version__)
          PY

      - name: Verify frozen v0.5 and v0.7 source inputs
        run: |
          rm -rf /tmp/v07_verify /tmp/v05_verify
          python3 scripts/build_locked_v07_reviewer_controls.py --out /tmp/v07_verify --per-family 80 > /tmp/v07_build.json
          ACTUAL=$(sha256sum /tmp/v07_verify/items.jsonl | awk '{print $1}')
          EXPECTED=d4960832076326ba5ed31ff3664095dea8c916ea3fabf7e482bcde8207f5cc7a
          echo "v0.7 items sha256: ${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED}"
          test "$(wc -l < /tmp/v07_verify/items.jsonl)" -eq 320
          python3 scripts/build_v05_corpus.py --out /tmp/v05_verify --per-family 400 > /tmp/v05_build.json
          cmp experiments/assistant_v05_seed202/report.json /tmp/v05_verify/report.json
          cmp experiments/assistant_v05_seed202/sha256.json /tmp/v05_verify/sha256.json
          echo 'Frozen v0.5 report and sha256 manifest reproduced exactly.'

      - name: Run post-hoc CPU diagnostics on frozen outputs
        run: |
          rm -rf revision_diagnostics
          python3 scripts/analyze_v07_submission_diagnostics.py \
            --root eval/locked_v07_reviewer_controls/outputs \
            --out-dir revision_diagnostics \
            --bootstrap 10000 \
            --seed 20260917
          python3 - <<'PY'
          import json
          d=json.load(open('revision_diagnostics/submission_diagnostics.json'))
          checks={
            ('qwen','mixed','self','mean_designated_score'):0.6494,
            ('qwen','mixed','other','mean_designated_score'):0.6346,
            ('qwen','mixed','focal','mean_designated_score'):0.6570,
            ('qwen','mixed','self','policy_agreement_accuracy'):0.6614,
            ('qwen','mixed','self','mean_S_sensitivity'):4.0648,
            ('mistral','mixed','focal','mean_S_sensitivity'):1.2803,
          }
          for (arch,phase,owner,key),expected in checks.items():
              actual=d[arch][phase]['absolute_performance'][owner][key]
              if abs(actual-expected)>0.00055:
                  raise SystemExit(f'manuscript diagnostic mismatch: {(arch,phase,owner,key)} {actual} != {expected}')
          q=d['qwen']['mixed']['switch_rates']
          assert abs(q['self_vs_other']['switch_rate']-0.02265625)<1e-12
          assert abs(q['self_vs_focal']['switch_rate']-0.0278125)<1e-12
          r=d['qwen']['seed_sensitivity']['loo_ranges']
          assert r['self_focal_change_vs_base']['max'] < 0
          assert r['focal_other_change_vs_base']['min'] > 0
          print('Manuscript exploratory diagnostics verified against generated output.')
          PY

      - name: Compile final anonymous ICLR PDF
        working-directory: paper
        env:
          SOURCE_DATE_EPOCH: '1790000000'
        run: |
          rm -f main.aux main.bbl main.blg main.log main.out main.pdf main.txt
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdfinfo main.pdf | tee pdfinfo.txt
          grep -E 'Overfull|Underfull|LaTeX Warning|Citation.*undefined|Reference.*undefined|Package .* Warning' main.log > warnings.txt || true
          if grep -Eq 'Overfull|Citation.*undefined|Reference.*undefined|There were undefined|Label\(s\) may have changed' warnings.txt; then
            echo 'Material LaTeX warning detected.' >&2
            cat warnings.txt >&2
            exit 1
          fi
          pdftotext -layout main.pdf main.txt
          if grep -Eqi 'khagendra|khatri|github\.com/Khagendra01|arewethesame|@gmail\.com' main.txt; then
            echo 'Identifying string found in rendered PDF text.' >&2
            exit 1
          fi
          if strings main.pdf | grep -Eqi 'khagendra|khatri|github\.com/Khagendra01|arewethesame|@gmail\.com'; then
            echo 'Identifying string found in PDF bytes/metadata.' >&2
            exit 1
          fi

      - name: Build and verify final release package
        run: |
          python3 scripts/build_iclr2027_revision_release.py \
            --dist dist_iclr_revision \
            --diagnostics revision_diagnostics \
            --v07-rebuilt /tmp/v07_verify \
            --commit "$GITHUB_SHA"
          test -f dist_iclr_revision/arewethesame_iclr2027_submission_revised.pdf
          test -f dist_iclr_revision/arewethesame_iclr2027_anonymous_supplement_revised.zip
          test -f dist_iclr_revision/arewethesame_iclr2027_source_revised.zip
          test -f dist_iclr_revision/iclr2027_openreview_fields_revised.txt
          test -f dist_iclr_revision/iclr2027_revision_and_verification_report.md
          sha256sum \
            dist_iclr_revision/arewethesame_iclr2027_submission_revised.pdf \
            dist_iclr_revision/arewethesame_iclr2027_anonymous_supplement_revised.zip \
            dist_iclr_revision/arewethesame_iclr2027_source_revised.zip \
            dist_iclr_revision/iclr2027_openreview_fields_revised.txt \
            dist_iclr_revision/iclr2027_revision_and_verification_report.md | tee dist_iclr_revision/DELIVERABLE_SHA256SUMS.txt

      - name: Upload exact revision deliverables
        uses: actions/upload-artifact@v4
        with:
          name: iclr2027-revised-${{ github.sha }}
          path: |
            dist_iclr_revision/arewethesame_iclr2027_submission_revised.pdf
            dist_iclr_revision/arewethesame_iclr2027_anonymous_supplement_revised.zip
            dist_iclr_revision/arewethesame_iclr2027_source_revised.zip
            dist_iclr_revision/iclr2027_openreview_fields_revised.txt
            dist_iclr_revision/iclr2027_revision_and_verification_report.md
            dist_iclr_revision/DELIVERABLE_SHA256SUMS.txt
            dist_iclr_revision/page_structure.json
            paper/main.log
            paper/pdfinfo.txt
            paper/warnings.txt
            revision_diagnostics/submission_diagnostics.json
            revision_diagnostics/absolute_performance.csv
            revision_diagnostics/switch_rates.csv
            revision_diagnostics/seed_sensitivity.csv
            revision_diagnostics/SUBMISSION_DIAGNOSTICS.md
