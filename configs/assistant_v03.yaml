mode: assistant-curated-v0.3
seed: 31

pilot:
  lives: 20
  episodes: 25
  variants: 2
  expected_scene_pairs: 1000
  expected_condition_rows: 5000

thresholds:
  min_fact_score: 0.95
  min_semantic_similarity: 0.90
  min_decision_equivalence: 0.95
  min_emotional_equivalence: 0.95
  min_motivational_equivalence: 0.95
  require_causal_structure_preserved: true
  require_no_answer_leakage: true
  require_no_personality_difference: true

provenance:
  renderer: gpt-5.6-sol
  auditor: gpt-5.6-sol
  render_contract: assistant_render_contract_v3
  audit_contract: assistant_blind_audit_v3

isolation:
  render_tasks: outputs/assistant_v03/render_tasks.jsonl
  hidden_truth: outputs/assistant_v03/truth.jsonl
  audit_tasks: outputs/assistant_v03/audit_tasks.jsonl
  expose_hidden_truth_to_renderer: false
  expose_hidden_truth_to_auditor: false

notes:
  - The simulator is the only source of experimental truth.
  - The recommended answer is stored separately and attached only during final ingest.
  - Renderer-facing history is deterministically derived from the simulator's matched other-history by replacing Agent A ownership with protected placeholders.
  - Rendering and auditing are separate passes.
  - Audit references come from the same ownership-neutral simulator source facts, not renderer paraphrases.
  - Self/other perspective binding is deterministic in repository code.
  - Numeric quantities are checked before an audit task can be produced.
  - Split by life, never by row.
